[package]
name = "notebook"
version = "0.1.0"
description = "An infinite-canvas notebook for notes, documents and ideas"
authors = ["Notebook contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notebook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"


# Release profile is tuned for fast production builds. Fat LTO (`lto = true`)
# plus a single codegen unit produces a marginally smaller binary, but makes
# every release build several times slower. Thin LTO keeps most of the runtime
# performance while allowing codegen to run in parallel.
#
# Need the smallest possible binary for a public release? Run the build script
# with `--quality`, which re-enables fat LTO just for that build.
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
incremental = false
debug = false
